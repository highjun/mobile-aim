name: Deploy to Play Store (Internal testing) and GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # gh release create

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set versionCode
        run: echo "VERSION_CODE=$((2000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Decode upload keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release-upload-key.jks

      - name: Write keystore.properties
        run: |
          cat > app/keystore.properties <<EOT
          storeFile=release-upload-key.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEYSTORE_KEY_PASSWORD }}
          EOT

      # Through env, not inline: a single quote inside the JSON would break an inline echo '...'.
      - name: Write Play Publisher service account credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > app/play-service-account.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tests gate the publish: Gradle stops at the first task failure, so a broken
      # testDebugUnitTest run never reaches publishReleaseBundle.
      - name: Test and publish to Internal testing
        run: ./gradlew testDebugUnitTest publishReleaseBundle -PversionCode=$VERSION_CODE

      - name: Build signed APK
        run: ./gradlew assembleRelease -PversionCode=$VERSION_CODE

      - name: Attach APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MobileAim-$VERSION_CODE.apk"
          gh release create "v$VERSION_CODE" "MobileAim-$VERSION_CODE.apk" \
            --title "MobileAim $VERSION_CODE" --notes "Commit ${{ github.sha }}" --target "${{ github.sha }}"
